# ── 训练超参 ──────────────────────────────────────────────────
distributed: false
precision: "bf16"
num_workers: 4
pin_memory: true
random_seed: 42

batch_size: 64
sample_batch_size: 20

num_epochs: 300
min_epochs: 50
patience: 20
log_step: 50
sample_epoch: 20
number_of_samples: 100

# ── 评估 ─────────────────────────────────────────────────────
